[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quake-agent-pipeline"
version = "1.0.0"
description = "An agent-orchestrated USGS earthquake data pipeline with Google ADK and GCS"
requires-python = ">=3.11"
dependencies = ["google-adk==2.14.1", "google-cloud-storage==3.17.1", "httpx==0.28.1"]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]
docs = ["reportlab==5.1.0", "pypdf==7.1.0"]

[project.scripts]
quake-pipeline = "quake_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["quake_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
